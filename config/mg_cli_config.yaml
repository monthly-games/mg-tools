# MG-CLI Configuration
# =====================

# Current environment: dev, staging, prod
env: dev

# Path to game repositories
repos_path: d:/mg-games/repos

# Firebase Configuration
firebase:
  # Project ID prefix (full ID: {prefix}{game_id})
  project_prefix: "mg-game-"

  # Shared development project (for testing)
  dev_project_id: "mg-games-dev"

  # Shared staging project
  staging_project_id: "mg-games-stg"

  # Services to enable
  services:
    - analytics
    - crashlytics
    - remote_config

# Ads Configuration
ads:
  # Google AdMob Test App IDs (use for development)
  android_app_id_test: "ca-app-pub-3940256099942544~3347511713"
  ios_app_id_test: "ca-app-pub-3940256099942544~1458002511"

  # Production App IDs (set per-game in ad_units.yaml)
  # android_app_id_prod: ""
  # ios_app_id_prod: ""

# Game Range Configuration
games:
  # Total games configured
  total: 52

  # Games that don't exist (skipped during batch operations)
  excluded:
    - 35
    - 39
    - 40
    - 41
    - 42
    - 43
    - 44
    - 45
    - 46
    - 47
