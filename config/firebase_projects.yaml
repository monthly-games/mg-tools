# Firebase Projects Configuration
# ================================
# Maps game IDs to Firebase project IDs

# Default pattern: mg-game-{game_id:04d}
# Override specific games below if needed

projects:
  # Example overrides:
  # "0001": "custom-project-id"

  # Shared projects (cost optimization)
  dev:
    project_id: "mg-games-dev"
    games: []  # Games using shared dev project

  staging:
    project_id: "mg-games-stg"
    games: []  # Games using shared staging project

# Project creation settings
creation:
  # GCP billing account (required for Blaze plan)
  # billing_account: ""

  # Default region for Firestore, Storage
  region: "asia-northeast3"  # Seoul

  # Enable services on creation
  auto_enable_services:
    - analytics
    - crashlytics
    - performance
    - remote_config
