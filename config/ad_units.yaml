# Production IDs (per-game configuration)
# Format: ca-app-pub-{publisher_id}/{unit_id}
production:
  # Example structure for each game:
  # "0001":
  #   android:
  #     app_id: "ca-app-pub-XXXXX~YYYYY"
  #     interstitial: "ca-app-pub-XXXXX/ZZZZZ"
  #     rewarded: "ca-app-pub-XXXXX/WWWWW"
  #   ios:
  #     app_id: "ca-app-pub-XXXXX~YYYYY"
  #     interstitial: "ca-app-pub-XXXXX/ZZZZZ"
  #     rewarded: "ca-app-pub-XXXXX/WWWWW"

# Ad placement strategy per game type
strategies:
  jrpg:
    # Show interstitial every N battles
    interstitial_frequency: 5
    # Rewarded video for stamina refill, gacha pull
    rewarded_placements:
      - stamina_refill
      - gacha_bonus
      - daily_reward_2x

  casual:
    # Show interstitial every N game overs
    interstitial_frequency: 3
    # Rewarded video for continue, bonus coins
    rewarded_placements:
      - continue_game
      - bonus_coins
      - remove_ads_temp

  idle:
    # Show interstitial every N minutes of active play
    interstitial_frequency_minutes: 5
    # Rewarded video for offline earnings boost
    rewarded_placements:
      - offline_earnings_2x
      - instant_progress
      - premium_currency
